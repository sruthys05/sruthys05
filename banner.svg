<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070f"/><stop offset="0.55" stop-color="#14102b"/><stop offset="1" stop-color="#2a0f3d"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7ae6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7ae6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
  <clipPath id="round"><rect width="1280" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- soft color blobs -->
  <circle cx="220" cy="80" r="150" fill="#a855f7" opacity="0.35" filter="url(#blur)"><animate attributeName="cx" values="220;300;220" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="80;130;80" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="340" r="170" fill="#ec4899" opacity="0.28" filter="url(#blur)"><animate attributeName="cx" values="1060;980;1060" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="60" r="110" fill="#3b82f6" opacity="0.22" filter="url(#blur)"><animate attributeName="cy" values="60;110;60" dur="8s" repeatCount="indefinite"/></circle>

  <!-- floating symbols -->
  <g font-family="'Consolas','Courier New',monospace" font-weight="700" fill="#c4b5fd" fill-opacity="0.55">
    <text x="640" y="70" font-size="34">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="1210" y="90" font-size="40">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="1180" y="380" font-size="30" fill="#f9a8d4">( )  ;<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="600" y="395" font-size="28" fill="#93c5fd">#<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- cloud graphic -->
  <g transform="translate(1135,150)" opacity="0.9">
    <path d="M30 70 a24 24 0 0 1 4 -47 a34 34 0 0 1 64 8 a22 22 0 0 1 -2 39 z" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M65 60 V36 M55 46 L65 35 L75 46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="translate" values="1135 150;1135 136;1135 150" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- left text -->
  <text x="72" y="92" font-size="22" font-weight="600" fill="#c4b5fd" letter-spacing="6">HELLO WORLD, I'M</text>
  <text x="68" y="188" font-size="96" font-weight="900" fill="url(#name)" filter="url(#glow)" letter-spacing="1">SRUTHY S</text>
  <text x="72" y="256" font-size="46" font-weight="800" fill="url(#pink)">Aspiring Engineer</text>
  <rect x="72" y="274" width="190" height="5" rx="2.5" fill="url(#bar)"><animate attributeName="width" values="40;260;40" dur="4s" repeatCount="indefinite"/></rect>
  <g transform="translate(70,318)"><rect width="90" height="34" rx="17" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.7"/><text x="45.0" y="22.5" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Python</text></g><g transform="translate(172,318)"><rect width="68" height="34" rx="17" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.7"/><text x="34.0" y="22.5" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Java</text></g><g transform="translate(252,318)"><rect width="57" height="34" rx="17" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.7"/><text x="28.5" y="22.5" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">AWS</text></g><g transform="translate(321,318)"><rect width="101" height="34" rx="17" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7"/><text x="50.5" y="22.5" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">AI / ML</text></g><g transform="translate(434,318)"><rect width="57" height="34" rx="17" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.7"/><text x="28.5" y="22.5" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">DSA</text></g>

  <!-- code window -->
  <g transform="translate(0,0)">
    <rect x="720" y="82" width="410" height="262" rx="16" fill="#0b0a1a" fill-opacity="0.82" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M720 98 a16 16 0 0 1 16 -16 h378 a16 16 0 0 1 16 16 v22 h-410z" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="744" cy="101" r="6" fill="#ff5f56"/><circle cx="766" cy="101" r="6" fill="#ffbd2e"/><circle cx="788" cy="101" r="6" fill="#27c93f"/>
    <text x="925" y="106" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="'Consolas',monospace">sruthy.py</text>
    <g font-family="'Consolas','Courier New',monospace">
    <text x="758" y="170" font-size="16" opacity="0"><tspan fill="#ff7ae6">class&#160;</tspan><tspan fill="#7dd3fc">Sruthy</tspan><tspan fill="#e2e8f0">:</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.100;0.120;0.93;1"/></text>
<text x="758" y="201" font-size="16" opacity="0"><tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;role&#160;</tspan><tspan fill="#ff7ae6">=&#160;</tspan><tspan fill="#fde68a">"Aspiring&#160;Engineer"</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.175;0.195;0.93;1"/></text>
<text x="758" y="232" font-size="16" opacity="0"><tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;stack&#160;</tspan><tspan fill="#ff7ae6">=&#160;</tspan><tspan fill="#a7f3d0">["Python","Java","AWS"]</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.250;0.270;0.93;1"/></text>
<text x="758" y="263" font-size="16" opacity="0"><tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;learning&#160;</tspan><tspan fill="#ff7ae6">=&#160;</tspan><tspan fill="#a7f3d0">["AI/ML","DSA"]</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.325;0.345;0.93;1"/></text>
<text x="758" y="294" font-size="16" opacity="0"><tspan fill="#e2e8f0">&#160;&#160;&#160;&#160;open_to&#160;</tspan><tspan fill="#ff7ae6">=&#160;</tspan><tspan fill="#fde68a">"collaboration"</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.400;0.420;0.93;1"/></text>
<text x="758" y="325" font-size="16" opacity="0"><tspan fill="#7dd3fc">Sruthy</tspan><tspan fill="#e2e8f0">.build()</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.475;0.495;0.93;1"/></text>

    <rect x="896.4" y="311" width="9" height="18" fill="#ff7ae6"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- bottom streak -->
  <rect x="0" y="414" width="1280" height="6" fill="url(#bar)"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></rect>
</g>
</svg>