<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1b1446"/>
      <stop offset="60%" stop-color="#0d0b2b"/>
      <stop offset="100%" stop-color="#05040f"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a76"/>
      <stop offset="50%" stop-color="#e8527a"/>
      <stop offset="100%" stop-color="#6a2c91"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd6ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#bfeaff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7fd6ff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8527a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8527a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="400" cy="200" r="85"/></clipPath>
  </defs>

  <style>
    .tw { animation: tw 3s ease-in-out infinite; }
    .tw2 { animation: tw 4.5s ease-in-out infinite 1s; }
    .tw3 { animation: tw 2.2s ease-in-out infinite 0.5s; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    .shoot { animation: shoot 6s linear infinite; }
    @keyframes shoot {
      0% { transform: translate(0,0); opacity: 0 }
      5% { opacity: 1 }
      25% { transform: translate(260px,110px); opacity: 0 }
      100% { transform: translate(260px,110px); opacity: 0 }
    }
  </style>

  <rect width="800" height="400" rx="24" fill="url(#bg)"/>

  <!-- nebula glow -->
  <circle cx="400" cy="200" r="190" fill="url(#glow)"/>
  <ellipse cx="140" cy="90" rx="130" ry="60" fill="#4b2fa8" opacity="0.15"/>
  <ellipse cx="680" cy="320" rx="150" ry="70" fill="#1c7ea8" opacity="0.14"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw" cx="40" cy="50" r="1.6"/>
    <circle class="tw2" cx="95" cy="160" r="1.2"/>
    <circle class="tw3" cx="150" cy="310" r="1.8"/>
    <circle class="tw" cx="210" cy="70" r="1.3"/>
    <circle class="tw2" cx="260" cy="230" r="1"/>
    <circle class="tw3" cx="300" cy="360" r="1.5"/>
    <circle class="tw" cx="330" cy="40" r="1.7"/>
    <circle class="tw2" cx="470" cy="35" r="1.2"/>
    <circle class="tw3" cx="520" cy="350" r="1.6"/>
    <circle class="tw" cx="560" cy="90" r="1"/>
    <circle class="tw2" cx="610" cy="250" r="1.8"/>
    <circle class="tw3" cx="650" cy="60" r="1.4"/>
    <circle class="tw" cx="700" cy="170" r="1.2"/>
    <circle class="tw2" cx="745" cy="45" r="1.7"/>
    <circle class="tw3" cx="760" cy="290" r="1.3"/>
    <circle class="tw" cx="60" cy="370" r="1.1"/>
    <circle class="tw2" cx="240" cy="150" r="1.5"/>
    <circle class="tw3" cx="580" cy="190" r="1"/>
    <circle class="tw" cx="120" cy="240" r="1"/>
    <circle class="tw2" cx="690" cy="375" r="1.5"/>
  </g>

  <!-- 4-point sparkle stars -->
  <g fill="#cfe9ff" class="tw">
    <path d="M180 120 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M630 130 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
  </g>

  <!-- shooting star -->
  <g class="shoot">
    <rect x="70" y="60" width="90" height="2" rx="1" fill="url(#trail)" transform="rotate(23 70 60)"/>
  </g>

  <!-- planet group -->
  <g class="float">
    <!-- back half of ring -->
    <ellipse cx="400" cy="200" rx="160" ry="38" fill="none" stroke="url(#ring)" stroke-width="8" transform="rotate(-18 400 200)" opacity="0.5"/>

    <!-- planet body -->
    <circle cx="400" cy="200" r="85" fill="url(#planet)"/>
    <g clip-path="url(#planetClip)">
      <ellipse cx="400" cy="170" rx="100" ry="10" fill="#fff" opacity="0.12"/>
      <ellipse cx="400" cy="205" rx="100" ry="14" fill="#3b1060" opacity="0.18"/>
      <ellipse cx="400" cy="240" rx="100" ry="9" fill="#fff" opacity="0.1"/>
      <circle cx="440" cy="240" r="85" fill="#05040f" opacity="0.35"/>
    </g>

    <!-- front half of ring -->
    <path d="M241 215 A160 38 0 0 0 559 185" fill="none" stroke="url(#ring)" stroke-width="8" transform="rotate(-18 400 200)" stroke-linecap="round"/>

    <!-- moon -->
    <circle cx="560" cy="110" r="16" fill="#d9d9ea"/>
    <circle cx="554" cy="105" r="3.5" fill="#b4b4cc"/>
    <circle cx="566" cy="116" r="2.5" fill="#b4b4cc"/>
  </g>

  <!-- small distant planet -->
  <circle cx="130" cy="260" r="22" fill="#2fb7a0"/>
  <circle cx="122" cy="254" r="22" fill="#05040f" opacity="0.25"/>
</svg>
