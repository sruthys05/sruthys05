<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/><stop offset="1" stop-color="#1a0f2a"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ae6"><animate attributeName="stop-color" values="#ff7ae6;#b66bff;#ff7ae6" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#b66bff"><animate attributeName="stop-color" values="#b66bff;#ff7ae6;#b66bff" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/></pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>

  <!-- floating glow orbs -->
  <circle cx="150" cy="90" r="70" fill="#b66bff" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cy" values="90;130;90" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="330" r="90" fill="#ff7ae6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="330;290;330" dur="7s" repeatCount="indefinite"/></circle>

  <!-- rising particles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="200" cy="420" r="2"><animate attributeName="cy" values="420;-10" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="420" r="3"><animate attributeName="cy" values="420;-10" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="420" r="2"><animate attributeName="cy" values="420;-10" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="420" r="3"><animate attributeName="cy" values="420;-10" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="420" r="2"><animate attributeName="cy" values="420;-10" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="1200" cy="420" r="3"><animate attributeName="cy" values="420;-10" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- purple streaks -->
  <g stroke="#b66bff" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <line x1="0" y1="360" x2="200" y2="410"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="1280" y1="330" x2="1080" y2="420"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- rotating arcs -->
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
    <path d="M1000 60 a45 45 0 0 1 0 90" transform-origin="1000 105">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 105" to="360 1000 105" dur="8s" repeatCount="indefinite"/></path>
    <path d="M200 280 a45 45 0 0 0 0 90" >
      <animateTransform attributeName="transform" type="rotate" from="360 200 325" to="0 200 325" dur="8s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="Impact, 'Arial Black', Arial, sans-serif" font-style="italic" font-weight="900" text-anchor="middle">
    <text x="640" y="170" font-size="110" fill="#fff" filter="url(#glow)" opacity="0">SRUTHY S
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      <animate attributeName="y" values="190;170" dur="1s" fill="freeze"/>
    </text>
    <text x="640" y="285" font-size="105" opacity="0">
      <tspan fill="#fff">ASPIRING </tspan><tspan fill="url(#pink)" filter="url(#glow)">ENGINEER</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="640" y="350" font-size="34" fill="#e8d9ff" letter-spacing="3" opacity="0">LET'S CONNECT AND BUILD TOGETHER
      <animate attributeName="opacity" values="0;1;0.65;1" dur="3s" begin="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
